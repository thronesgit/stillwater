<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stillwater</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #0a0a1a;
    --midnight: #0d0d2b;
    --dusk1: #1a1040;
    --dusk2: #2d1b5e;
    --horizon: #3d2470;
    --twilight: #5c3490;
    --lavender: #8b5fc4;
    --mist: #b48de0;
    --peach: #e8c4d8;
    --foam: #f0e8f5;
    --glow: rgba(180, 141, 224, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Jost', sans-serif;
    background: var(--deep);
    color: var(--foam);
    user-select: none;
  }

  /* ── BACKGROUND LAYERS ── */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg,
      #060612 0%,
      #0d0d2b 20%,
      #1a1040 40%,
      #2d1b5e 62%,
      #3d2470 75%,
      #4a2a7a 85%,
      #3d3060 92%,
      #2a2850 100%
    );
  }

  /* Breathing gradient orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0;
    animation: orbPulse var(--dur) ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }
  .orb1 {
    width: 60vw; height: 60vw;
    left: -10vw; top: 10vh;
    background: radial-gradient(circle, rgba(92,52,144,0.5) 0%, transparent 70%);
    --dur: 8s;
    animation-delay: 0s;
  }
  .orb2 {
    width: 50vw; height: 50vw;
    right: -5vw; top: 30vh;
    background: radial-gradient(circle, rgba(61,36,112,0.4) 0%, transparent 70%);
    --dur: 11s;
    animation-delay: -4s;
  }
  .orb3 {
    width: 40vw; height: 40vw;
    left: 20vw; bottom: 20vh;
    background: radial-gradient(circle, rgba(139,95,196,0.25) 0%, transparent 70%);
    --dur: 13s;
    animation-delay: -7s;
  }
  @keyframes orbPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.12); }
  }

  /* Stars */
  #stars {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: starTwinkle var(--d) ease-in-out infinite;
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: var(--min); }
    50% { opacity: var(--max); }
  }

  /* Ocean / wave layer */
  #ocean {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38vh;
    z-index: 2;
    overflow: hidden;
  }
  .wave {
    position: absolute;
    bottom: 0; left: 0;
    width: 200%; height: 100%;
    border-radius: 50% 50% 0 0 / 20% 20% 0 0;
    transform-origin: bottom center;
  }
  .wave1 {
    background: linear-gradient(180deg, rgba(45,27,94,0.0) 0%, rgba(13,13,43,0.85) 60%, rgba(6,6,18,0.98) 100%);
    animation: waveMov1 14s ease-in-out infinite;
    bottom: 0;
  }
  .wave2 {
    background: linear-gradient(180deg, rgba(92,52,144,0.0) 0%, rgba(30,20,70,0.6) 50%, rgba(10,10,26,0.95) 100%);
    animation: waveMov2 18s ease-in-out infinite;
    bottom: 2vh;
  }
  .wave3 {
    background: linear-gradient(180deg, rgba(139,95,196,0.0) 0%, rgba(45,27,94,0.3) 40%, rgba(13,13,43,0.7) 100%);
    animation: waveMov3 22s ease-in-out infinite;
    bottom: 5vh;
  }
  /* shimmer line at wave crest */
  .wave-shimmer {
    position: absolute;
    bottom: 30vh; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(180,141,224,0.3) 30%, rgba(232,196,216,0.5) 50%, rgba(180,141,224,0.3) 70%, transparent 100%);
    animation: shimmerMov 14s ease-in-out infinite;
    z-index: 3;
    pointer-events: none;
  }
  @keyframes waveMov1 {
    0%, 100% { transform: translateX(0) scaleY(1); }
    50% { transform: translateX(-8%) scaleY(1.04); }
  }
  @keyframes waveMov2 {
    0%, 100% { transform: translateX(-5%) scaleY(1); }
    50% { transform: translateX(3%) scaleY(1.06); }
  }
  @keyframes waveMov3 {
    0%, 100% { transform: translateX(3%) scaleY(1); }
    50% { transform: translateX(-6%) scaleY(1.08); }
  }
  @keyframes shimmerMov {
    0%, 100% { bottom: 30vh; opacity: 0.4; }
    50% { bottom: 31.5vh; opacity: 0.8; }
  }

  /* Reflection on water */
  .reflection {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 35vh;
    z-index: 2;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(139,95,196,0.04) 30%,
      rgba(92,52,144,0.08) 60%,
      rgba(45,27,94,0.15) 100%
    );
    pointer-events: none;
  }

  /* ── LAYOUT ── */
  #app {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem 1.5rem;
    gap: 2.5rem;
  }

  /* Title */
  #title {
    text-align: center;
    letter-spacing: 0.35em;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: clamp(0.75rem, 2vw, 0.9rem);
    text-transform: uppercase;
    color: rgba(180,141,224,0.7);
    opacity: 0;
    animation: fadeUp 2s ease 0.5s forwards;
  }

  /* Message card */
  #card {
    max-width: 560px; width: 100%;
    text-align: center;
    position: relative;
  }
  #message {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.15rem, 3.5vw, 1.45rem);
    line-height: 1.85;
    color: rgba(240,232,245,0.92);
    opacity: 0;
    transition: opacity 0.7s ease;
    padding: 0 0.5rem;
    text-shadow: 0 0 40px rgba(139,95,196,0.3);
  }
  #message.visible { opacity: 1; }

  #msg-num {
    margin-top: 1.2rem;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: rgba(180,141,224,0.35);
    opacity: 0;
    animation: fadeUp 2s ease 1s forwards;
  }

  /* Divider */
  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180,141,224,0.4), transparent);
    margin: 0 auto;
    opacity: 0;
    animation: fadeUp 2s ease 0.8s forwards;
  }

  /* ── BOX BREATHING ── */
  #breathing {
    display: flex; flex-direction: column;
    align-items: center; gap: 1rem;
    opacity: 0;
    animation: fadeUp 2s ease 1.2s forwards;
  }
  #breath-label {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(180,141,224,0.5);
  }
  #breath-phase {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: rgba(232,196,216,0.8);
    letter-spacing: 0.05em;
    min-height: 1.2rem;
    transition: opacity 0.4s ease;
  }

  #box-container {
    position: relative;
    width: 100px; height: 100px;
  }
  #box-bg {
    position: absolute; inset: 0;
    border-radius: 16px;
    background: rgba(45,27,94,0.2);
    border: 1px solid rgba(180,141,224,0.1);
  }
  /* The animated fill */
  #box-fill {
    position: absolute; inset: 0;
    border-radius: 16px;
    background: radial-gradient(circle at center, rgba(139,95,196,0.35), rgba(92,52,144,0.15));
    transform: scale(0);
    transition: transform 4s linear, opacity 0.5s ease;
    opacity: 0;
  }
  /* The corner dot that travels the perimeter */
  #dot {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(232,196,216,0.9);
    box-shadow: 0 0 12px rgba(232,196,216,0.6), 0 0 24px rgba(180,141,224,0.4);
    top: -5px; left: -5px;
    animation: boxDot 16s linear infinite;
  }
  /* Box border that traces */
  svg#box-trace {
    position: absolute; inset: -1px;
    width: calc(100% + 2px); height: calc(100% + 2px);
    overflow: visible;
  }
  #trace-path {
    fill: none;
    stroke: url(#traceGrad);
    stroke-width: 1.5;
    stroke-dasharray: 392;
    stroke-dashoffset: 392;
    animation: traceDraw 16s linear infinite;
    stroke-linecap: round;
  }
  @keyframes traceDraw {
    0% { stroke-dashoffset: 392; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes boxDot {
    0%   { top: -5px; left: -5px; }
    25%  { top: -5px; left: calc(100% - 5px); }
    50%  { top: calc(100% - 5px); left: calc(100% - 5px); }
    75%  { top: calc(100% - 5px); left: -5px; }
    100% { top: -5px; left: -5px; }
  }

  /* Next button */
  #next-btn {
    background: none;
    border: 1px solid rgba(180,141,224,0.3);
    border-radius: 100px;
    color: rgba(180,141,224,0.75);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.65rem 2rem;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: fadeUp 2s ease 1.5s forwards;
  }
  #next-btn:hover {
    background: rgba(139,95,196,0.15);
    border-color: rgba(180,141,224,0.6);
    color: rgba(232,196,216,0.9);
    box-shadow: 0 0 20px rgba(139,95,196,0.2);
  }
  #next-btn:active { transform: scale(0.97); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Background -->
<div id="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div id="stars"></div>
<div id="ocean">
  <div class="wave wave3"></div>
  <div class="wave wave2"></div>
  <div class="wave wave1"></div>
</div>
<div class="wave-shimmer"></div>
<div class="reflection"></div>

<!-- App -->
<div id="app">
  <div id="title">Stillwater</div>

  <div id="card">
    <p id="message"></p>
    <div id="msg-num"></div>
  </div>

  <div class="divider"></div>

  <!-- Box breathing -->
  <div id="breathing">
    <div id="breath-label">box breathing</div>
    <div id="breath-phase">breathe in</div>
    <div id="box-container">
      <div id="box-bg"></div>
      <div id="box-fill"></div>
      <svg id="box-trace" viewBox="-1 -1 102 102">
        <defs>
          <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(232,196,216,0.8)"/>
            <stop offset="100%" stop-color="rgba(139,95,196,0.4)"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" rx="15" id="trace-path"/>
      </svg>
      <div id="dot"></div>
    </div>
  </div>

  <button id="next-btn">next message</button>
</div>

<script>
// ── STARS ──
(function() {
  const s = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    const size = Math.random() * 2 + 0.5;
    const minO = (Math.random() * 0.1 + 0.05).toFixed(2);
    const maxO = (Math.random() * 0.4 + 0.3).toFixed(2);
    const dur = (Math.random() * 5 + 3).toFixed(1);
    el.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*60}%;
      --min:${minO}; --max:${maxO}; --d:${dur}s;
      animation-delay:${(Math.random()*6).toFixed(1)}s;
    `;
    s.appendChild(el);
  }
})();

// ── BOX BREATHING PHASE LABELS ──
(function() {
  const phases = ['breathe in', 'hold', 'breathe out', 'hold'];
  const durations = [4000, 4000, 4000, 4000];
  let idx = 0;
  const label = document.getElementById('breath-phase');
  function nextPhase() {
    label.style.opacity = '0';
    setTimeout(() => {
      idx = (idx + 1) % phases.length;
      label.textContent = phases[idx];
      label.style.opacity = '1';
    }, 300);
    setTimeout(nextPhase, durations[idx]);
  }
  label.textContent = phases[0];
  setTimeout(nextPhase, durations[0]);
})();

// ── 1000 MESSAGES ──
const MESSAGES = [
  // ── GROUNDING & PRESENCE ──
  "You are here, right now, in this exact moment. Not in tomorrow, not in the past — here. The floor beneath you is solid. The air you are breathing is real. This present moment is the only one you are in, and it is safe. Come back to it gently, like returning home after a long walk.",
  "Anxiety speaks in the future tense. It tells you about things that haven't happened, in a voice that sounds urgent and certain. But right now, in this actual moment, you are okay. Look around. You are safe in this present breath. The future is not here yet, and you have everything you need right now.",
  "Notice five things you can see. Four things you can touch. Three you can hear. Two you can smell. One you can taste. You are not spiraling — you are here, in your body, in this room, in this moment. The world around you is stable, and so are you.",
  "Your nervous system is doing its job. It got a signal that felt threatening and it responded — that's not a flaw, that's physiology. Right now you can gently reassure it. Place your hand on your chest. Feel your own heartbeat. Tell your body: I hear you. We are okay. You can rest now.",
  "The mind can run very fast. It can be three days ahead before you've even finished a sentence. That's okay — you just need to invite it back. Back to the room. Back to your breath. Back to the texture of the seat beneath you and the simple, ongoing fact that you are alive and present.",
  "Anxiety often feels like a freight train, but it is actually more like a wave. It rises, and it falls. It always falls. You have survived every difficult moment you have ever had — the percentage is one hundred. This wave will pass too, and you will be standing afterward.",
  "Ground yourself in the body. Wiggle your toes. Press your palms together. Take a breath that inflates your belly. These are not tricks — they are pathways back to the body from the runaway mind. The body knows how to be here. Let it show you.",
  "You do not have to solve everything right now. You don't have to understand it, fix it, or even name it. All you have to do, in this exact second, is breathe. The rest can wait. Right now, breathing is enough. Breathing is, in fact, everything.",
  "When the ground feels unsteady, find a physical anchor. The weight of your hands in your lap. The temperature of air entering your nostrils. The steadiness of a wall beside you. Anchors don't fix anything — they just remind you that you are here, and that here is solid.",
  "Right now, just for this moment, you don't have to do anything about the thing you're anxious about. You just have to be in this room, taking breaths. Whatever is ahead of you, it is not here right now. Here is quiet. Here is manageable. Come back here.",
  "The present moment is actually very small and very safe. It's everything beyond it that feels vast and frightening. But you only ever live in the present moment. You don't have to survive tomorrow — tomorrow you'll have a new present moment to stand in, and you'll handle it then.",
  "Take a slow look at your surroundings. Real things. Solid things. The color of the wall. The weight of your own body sitting or lying down. These ordinary things are your allies right now. They are telling you: this is real, this is now, and now is safe.",
  "Let yourself simply observe. You don't have to change anything, fix anything, or figure anything out. Just observe: the rhythm of your breath, the sounds in the room, the sensation of your feet on the floor. Observation is a form of presence, and presence is a form of peace.",
  "If your thoughts are racing, it's because your brain is trying to protect you. It's doing exactly what it was designed to do. You can thank it — genuinely — and then gently bring your attention back to the breath. You are the one who decides where attention goes. Let it go somewhere quiet.",
  "In this moment you have air in your lungs, ground beneath you, and time enough to take one more breath. That is actually quite a lot. The catastrophe that feels imminent is still just a feeling, not a fact. Come back to what is actual: you are here, and you are breathing.",
  "There is a part of you that is always watching calmly, no matter how turbulent things feel. It's the part reading these words right now. That quiet observer is you, too — the steady, unhurried you. Rest in it for a moment. Let the noise pass in front of you like weather.",
  "Your body holds wisdom. When you feel flooded, slow down. Place both feet flat on the floor. Breathe into your belly. Let your shoulders soften. You are not obligated to be braced for impact at all times. Your body is allowed to rest, even now.",
  "Anxiety makes things feel more urgent than they are. The biological alarm system doesn't distinguish between a real threat and an imagined one — it just fires. Knowing this can give you a little distance. You can ask: is this actually happening right now, or is my alarm going off early?",
  "Come back to the senses. What is the temperature in the room right now? Is the air still or moving? What sounds are in the background? Senses live only in the present. When you're in your senses, you're not in the story. The story can wait.",
  "This moment is complete as it is. Not every moment needs to be resolved. Right now, you can just let this one be what it is — imperfect, maybe uncomfortable — without rushing toward the next one. You don't have to hurry. You are allowed to simply be here.",

  // ── SELF-COMPASSION ──
  "Whatever you're feeling right now is valid. Anxiety, fear, the unnamed sense that something is wrong — all of it is real, and none of it means you are broken. It means you are a feeling human being doing their best in a complicated world. That deserves compassion, not judgment.",
  "You would never speak to a friend the way you sometimes speak to yourself. You would not say 'you're pathetic for being scared' or 'you should have this together by now.' You would be gentle. You would say: I'm here with you, and you're going to be okay. Say that to yourself now.",
  "You are not weak for struggling. Some of the strongest people you know have felt exactly this way — terrified, overwhelmed, like they're holding too much. Strength is not the absence of hard feelings. It's continuing to breathe through them. You are already doing that. You are already strong.",
  "There is no version of this that you should have handled better. You are doing the absolute best you can with the information, energy, and capacity you have right now. That is not a low bar — it is the only honest bar. Give yourself credit for being here and trying.",
  "Anxiety doesn't mean you're failing at life. It often means you care deeply, that things matter to you, that you have a sensitive and perceptive nervous system. These can also be gifts. Right now they're turned up too loud, but the underlying quality — caring — is not your enemy.",
  "You are allowed to feel this without having to justify it. You don't owe anyone an explanation for your anxiety, and you don't need to convince yourself it's rational to let it be real. It's already real. It's already valid. What you need now is not justification, but kindness.",
  "The critical voice that shows up when you're anxious — the one cataloguing everything you've done wrong — is not the truth. It's a scared part of you trying to find control by finding fault. It's not your wisest self. Your wisest self is quieter. It says: you're doing okay. Keep going.",
  "You don't have to perform wellness right now. You don't have to convince anyone — including yourself — that you're fine. You're allowed to be in the middle of it, honestly, without rushing toward okay. Sometimes the most courageous thing is simply to stay with yourself without running.",
  "Being hard on yourself has probably never made the anxiety smaller. And yet it keeps trying. So try something different: what would you feel like right now if you were completely on your own side? If you genuinely believed you were doing your best? Inhabit that, just for a moment.",
  "You carry a lot. More than people around you might see. It makes sense that sometimes it's heavy. You don't have to make it lighter by pretending it's fine. You can just acknowledge: this is a lot, I'm carrying it, and that's genuinely hard. You're allowed to say that.",
  "Your feelings are not overreactions. They are your nervous system translating experience into sensation and emotion. You can disagree with the conclusions your brain is drawing — 'this is catastrophic' — while still treating the feeling with respect. The feeling is real. The catastrophe is still uncertain.",
  "Imagine holding the version of yourself that is scared right now as you would hold a small child. Not trying to fix it or stop it, just holding it gently and saying: I'm here, I know this is hard, we'll get through this together. That's the energy you need. Be it for yourself.",
  "You are not too much. Your feelings are not too much. The fact that you feel deeply is not a flaw to be corrected. It's a part of you that deserves tenderness, not management. You are allowed to take up the emotional space that your experience requires.",
  "This struggle does not define you. You are not 'an anxious person' the way a mountain is a mountain — you are a full human who is experiencing anxiety right now. The experiencing will change. You will feel other things. This is a weather pattern, not a permanent landscape.",
  "When you're in the middle of it, it can feel like you should be punished for not being better. For not being calmer, more together, more capable. But this is not a punishment situation. This is a rest and gentleness situation. You need care, not criticism. Give yourself that.",
  "Every person you admire has been anxious. Has been in the dark, not knowing how it would turn out. Has lain awake at night, heart pounding, wondering if they would be okay. You are not uniquely flawed. You are deeply human. And humans get through hard things. You will too.",
  "What you're feeling right now does not predict the future. It reflects your nervous system's current state — which is temporary, which is subject to change, which will shift. You have felt good before. You will feel good again. This is not the final word on how your life goes.",
  "You deserve the same patience you would give to someone else who was struggling. You would not tell them to snap out of it. You would sit with them. You would say: I see you, and I'm not leaving. Say that to yourself, and then stay with yourself for a minute. Just stay.",
  "There is bravery in being gentle with yourself when everything in you wants to fight or flee or disappear. Choosing softness — even for sixty seconds — is an act of courage. You are being brave right now, even if it doesn't feel that way from the inside.",
  "You are worthy of peace. Not after you've fixed yourself, not once you've figured it all out — now, as you are, with everything still unresolved. Worthiness is not conditional. Peace is not a reward. They are things you are allowed to have right now, exactly as you are.",

  // ── IMPERMANENCE & THE WAVE ──
  "This will pass. Not because it's not real, not because you have to push through it, but because everything does. States shift. Feelings move. The brain cannot sustain maximum alarm forever. There will be a moment, maybe soon, when you exhale and notice it's a little quieter. That's coming.",
  "There is not a single difficult emotional experience you have had that did not eventually ease. Not one. The ones that felt unsurvivable — you survived. The ones you were sure would never end — they ended. This one will too. That's not wishful thinking. That's your entire track record.",
  "Feelings don't get stuck unless we fight them. When we let them move through, they do. Try not to push against this one. Let it be here. Observe it. It's already moving — anxiety in the body never truly stops moving — and eventually it will move on through. You just have to let it pass.",
  "You've felt this before and you've come back from it. Every single time. You may not have felt great on the other side — just okay was enough. Just okay counts. You've been okay after every difficult moment. You will be okay after this one too.",
  "The intensity you feel right now is temporary. Your brain is in a particular state, flooded with a particular chemistry, and that chemistry will metabolize. It always does. Your job right now is not to stop it — just to stay soft while it moves through. It's already moving.",
  "Waves don't stop being waves because you're afraid of them. But you can learn to float. You don't have to fight the water — you can let it carry you for a moment. Anxiety is a wave. Let it lift you without pulling you under. It will recede. It always recedes.",
  "Nothing that is happening in your mind right now is permanent. The worry, the fear, the tightness — all of it is passing through. Your mind is like a sky and these feelings are weather. The sky doesn't stop being the sky during a storm. You don't stop being yourself during anxiety.",
  "Right now feels overwhelming. But consider: right now is actually a very small window of time. In an hour you might feel different. In a day, almost certainly different. The feeling that is so total right now has a time limit. You are closer to the other side than it seems.",
  "Whatever fear is presenting itself to you — it is not predicting the future. It is a sensation in the body, a thought in the mind. It says 'this will be terrible' but it cannot actually see what's coming. Feelings are not prophecies. They are echoes of past experiences asking to be soothed.",
  "Just because something feels permanent doesn't mean it is. Emotional states are among the most temporary things in existence — they shift with sleep, with breath, with food, with time, with a song or a conversation. You are not stuck here. You are just here for now.",
  "You have already survived the hardest moments of your life. Whatever they were. You got through them — sometimes barely, sometimes messily, sometimes not how you imagined — but you got through. Your survival rate is unbroken. This too is survivable. You are already surviving it.",
  "The fact that this feels unbearable is information about intensity, not duration. Things can feel unbearable and still end. They can feel permanent and still pass. The feeling is real. The forecast it's giving you is not reliable. Trust your history over your anxiety's predictions.",
  "There is relief on the other side of this moment. You've touched it before — that particular quiet that comes after the wave peaks and starts to fall. It's real. It exists. You've been there. You will be there again. This is just the part before that.",
  "Anxiety is not your permanent address. It is a state you move through. You have other states — ease, joy, focus, rest — and you will return to them. They haven't disappeared; they're just offstage right now. The stage is set for them to return.",
  "Every difficult feeling contains its own completion. It rises and it falls. It tightens and it releases. Even without you doing anything, your nervous system is working toward equilibrium. Your body knows how to come back to baseline. It's trying to right now.",
  "You are not behind where you should be. You are exactly where you are, which is the only place you can ever be. The idea that you should be calmer, more healed, more together by now — that's not a real standard. This is your real experience. This moment is valid.",
  "What you are feeling will not always feel like this. The texture, the weight, the quality of this particular experience — it will change. Feelings have shapes and those shapes shift. What feels like a wall right now may feel like a door in an hour. Wait for the door.",
  "You've had hard mornings that turned into okay afternoons. You've had terrifying moments that dissolved into ordinary ones. You know from direct experience that emotional states transform. This one will transform. It may be doing so already, slowly, without your notice.",
  "Even a few minutes from now, something will be different. Your breath will have slowed a little, or you'll have shifted position, or a thought will have passed. Small changes compound. The path back to calm is made of small changes, and you're already on it.",
  "There is a version of you — not far away, just a bit forward in time — who has come through this. Who is breathing normally and feeling something softer. That version of you is real. You are walking toward them with every breath you take.",

  // ── REFRAMING & PERSPECTIVE ──
  "The worst-case scenario your mind is constructing right now is one possibility among many. Your brain is highlighting it because of how fear works — it amplifies potential threats to keep you safe. But the other possibilities are equally real, and most of them are far more likely.",
  "Anxiety often convinces us that something is certain that is actually only possible. 'This will go wrong' is a prediction, not a fact. The future is genuinely unknown. That's frightening, but it also means it could go fine. It could go better than fine. You genuinely don't know yet.",
  "What if the feeling you're having is not a warning but just a feeling? What if your nervous system is activated and there's nothing you need to do about the content of the thoughts, only about the state of the body? What if the alarm is real but the danger isn't?",
  "Your brain is telling you a story. It may feel entirely like reality, but stories have narrators, and narrators have biases. The bias here is toward threat. Ask yourself: is there another story? One where this is hard but manageable? One where you come out okay? That story is also available.",
  "The certainty that things will go badly is not evidence that things will go badly. The brain in an anxious state generates vivid, convincing scenarios. But vividness is not accuracy. You've been sure before and been wrong. You may be wrong now. Leave room for that.",
  "Not everything that feels urgent is urgent. The body's alarm system fires whether the threat is real or imagined. You get to be the one who decides if action is actually needed right now. Often the answer is: not yet. Often the answer is: nothing needs to happen in this second.",
  "Consider that you might be more capable of handling whatever is ahead than your current fear is telling you. Fear underestimates. You have handled things you were certain would break you. You found resources you didn't know you had. That capacity is still in you. It doesn't expire.",
  "The thought 'I can't handle this' has never been accurate. You have, in fact, handled everything that has ever been handed to you. Sometimes barely. Sometimes not elegantly. But you handled it. The belief that this will be the one you can't survive is your anxiety speaking, not your history.",
  "Hard things happen. People move through them. Not perfectly, not without pain — but through. You are not an exception to this. You are not the one person who cannot get through difficulty. You are human, which means you are designed to adapt, recover, and continue.",
  "What are you actually certain of, in this moment? Not what might happen — what is actually, verifiably true right now? Usually it's much smaller than the fear. Usually it's: I am here, I am breathing, I don't know how this will go. That's enough to work with.",
  "Catastrophizing feels like being realistic, but it isn't. It's taking one possible outcome and treating it as inevitable. Real realism says: I don't know what will happen. Things could go many ways. The feared outcome is possible but so are many others, including fine.",
  "The story you're telling yourself about this situation may be accurate. It may also be a first draft written in a state of fear. First drafts are rarely the final word. Wait until you can reread it from a calmer place. You might find you wrote it differently than you thought.",
  "Pain is real. Suffering is the additional layer we add by fighting pain, predicting more pain, or declaring that pain is unacceptable. You cannot always reduce the pain. But sometimes you can reduce the suffering by staying with what is actually happening now instead of what might happen next.",
  "Some problems look enormous close up and manageable from a distance. Anxiety brings you very close — uncomfortably close. If you can get some distance, even metaphorically — by breathing, by stepping back mentally — the thing may look different. Not solved, just more proportionate.",
  "What would you tell a person you love if they were feeling this? You would probably not tell them to think harder about all the ways it could go wrong. You would say: you've got this, and even if you don't, you'll figure it out, and I'll be here. Say that to yourself.",
  "Fear is information. It's telling you that something matters to you, that you have something at stake. That's worth knowing. But fear is not instruction. It doesn't get to tell you what to do or predict the outcome. It just gets to let you know it's there. Noted. Now breathe.",
  "The fact that you are anxious does not mean the thing you're anxious about is going to go badly. There is no correlation. You have been anxious before things that went fine. You have been calm before things that were hard. Anxiety is not a weather forecaster for your life.",
  "Your imagination is powerful and vivid and it is currently pointed at danger. But the same imagination can be redirected. What would it look like if this turned out okay? Not perfectly — just okay. What would that feel like? Let yourself imagine it, just for a moment.",
  "You are allowed to feel better without having solved anything. Relief doesn't have to be earned by fixing the problem. You can set the problem down for a moment, breathe, let your nervous system settle, and then come back to it when you're not flooded. Problems aren't going anywhere.",
  "Nothing about this moment is permanent. Not the feeling, not the situation, not the uncertainty. You are in the middle of something, and the middle is not the end. The story is still being written. You don't know how it ends yet, and that means there's still room for good.",

  // ── ACCEPTANCE & LETTING GO ──
  "What if you didn't have to figure this out right now? What if you just had to breathe through this moment? The figuring out can come later, when you're steadier. For right now, the only task is to be here and let your nervous system return to itself.",
  "Resistance to feelings often makes them louder. When we say 'I shouldn't feel this,' the feeling has to fight to be heard. What if you just said: okay, you can be here. I'm not running from you. What happens when you stop fighting and just let it sit beside you?",
  "You don't have to fix everything that is broken. You don't have to understand everything that is confusing. Some things remain unsolved. Life continues anyway. You continue anyway. Let some things be uncertain and unfixed right now. That is survivable.",
  "Some anxiety is the price of caring. You care about things — about people, outcomes, your own life — and that creates vulnerability. You cannot care and be perfectly invulnerable at the same time. The anxiety is proof of love, of investment, of aliveness. Let it be that.",
  "Letting go doesn't mean not caring. It means releasing your grip on controlling what you cannot control. You can still care deeply about something and release the need to manage its every outcome. Care and control are different. You can have one without the other.",
  "The future is not yours to hold. It's not because you're not capable — it's because no one can hold the future. It's genuinely outside any human hand. You can plan, you can prepare, you can try — and then you have to let the rest unfold. The unfolding is not yours to force.",
  "You are not responsible for controlling every outcome. You are responsible for showing up, doing your best, making choices with the information you have. What happens next — that belongs to forces much larger than individual will. You can release that part. You have to, actually.",
  "There is a difference between things that are in your control and things that aren't. Your breath is in your control. Your next action is in your control. The outcome of many things is not. Focusing on the controllable is not giving up — it's wisdom.",
  "Uncertainty is not the same as danger. The future being unknown is its permanent condition — that's always been true. But you've lived in uncertain conditions your whole life and come through. Uncertainty is uncomfortable, not catastrophic. Let it be uncomfortable without making it more.",
  "You can hold two things at once: this is hard, and I am going to be okay. They are not contradictory. Hard things happen to people who are okay. Difficult moments are part of lives that are fundamentally whole. You can be in a hard part and still be fundamentally okay.",
  "What can you actually control right now? Your breath. Your posture. Whether you are kind to yourself in the next five minutes. That's real power. More power than worrying gives you. Put your energy where it can actually do something: right here, right now, in the small choices.",
  "Sometimes the bravest thing is to admit you don't know, and then keep breathing anyway. You don't know how things will turn out. That's genuinely true. And you're doing it — you're showing up without the guarantee. That's remarkable. That's what everyone who has ever lived has had to do.",
  "The version of you that was afraid of things you've now been through — they made it. You didn't know then how you would, but you did. The you of the future is already on the other side of what you're afraid of now, looking back with relief. You will get there too.",
  "You don't have to like this feeling. You don't have to be at peace with it. You just have to let it be here without fighting it into something worse. Tolerance is enough right now. You don't have to achieve transcendence — just tolerance. That's a very achievable bar.",
  "The mind wants resolution. Closure. A clear answer. But sometimes life is asking you to sit in the in-between without one. That's not a failure of the situation — it's just the shape of this particular moment. You can be in the in-between. It's uncomfortable but survivable.",
  "You are not in charge of what other people think or do. You are not in charge of how things go. You are in charge of how you treat yourself in the meantime. Be generous with yourself. Be patient. Be the person who is on your side even when you're not at your best.",
  "Releasing control doesn't mean not caring. It means trusting — trusting yourself to handle what comes, trusting that most things work out in some form, trusting that you have more resilience than fear is telling you. Trust is not naivety. It's the accumulated evidence of a life lived.",
  "Right now, in this very moment, there is nothing that requires you to panic. There may be uncertainty. There may be difficulty ahead. But right now — this second — all you are required to do is breathe and be. Nothing is on fire this very second. This second is actually okay.",
  "What you are afraid of is not yet real. It's a projection, a possibility, a story your brain is generating. You don't have to fight it. You don't have to believe it, either. You can just notice it: my brain is doing its worried thing. Thank you. I'll just stay here and breathe.",
  "The need to know how things will turn out is deeply human. But certainty is not actually available. What is available is presence. Being fully here, fully alive, in the not-knowing. That takes courage, and you're doing it. Every anxious breath in uncertainty is a form of bravery.",

  // ── RESILIENCE & STRENGTH ──
  "You have a long history of surviving hard days. Every single day you've ever had that felt unsurvivable — you're on the other side of it now. That's not luck. That's you. That's a kind of strength that doesn't get enough credit.",
  "You were built for difficulty. Not because life is cruel, but because you are adaptive, resourceful, and resilient by nature. Your brain, your body, your entire evolutionary history has been shaped by the need to get through hard things. You are made for this.",
  "Think of something difficult you got through that you thought you couldn't. It exists. You got through it. You may not have gotten through it gracefully, but you made it to the other side. That proof — that direct evidence of your own resilience — is real and it applies now.",
  "You are stronger than the feeling you're having right now. You might not feel like it — the feeling might feel enormous and you might feel small. But you have outlasted feelings like this before. You will outlast this one. The feeling is not the measure of your strength.",
  "There is grit in you that shows up when you need it. Not superhero grit — ordinary human grit. The kind that keeps you going when you'd rather stop. The kind that puts one foot in front of the other on the hardest days. It's there. You've accessed it before. It's available now.",
  "Coping is a skill and you have been practicing it your entire life. Every hard moment you moved through taught you something. You have a repertoire now, even if it doesn't feel like it. You know things about your own resilience that you haven't fully acknowledged yet.",
  "The version of you who gets through this is not a different, better, more together version. It's this version — the one that's scared right now, the one reading this, the one breathing through it. You get through it as yourself. That's allowed.",
  "You don't have to be fearless to be brave. You can be terrified and still do the next thing. You can be shaking and still move forward. Bravery is not the absence of fear — it's continuing in the presence of it. By that definition, you are being brave right now.",
  "You have survived one hundred percent of your worst days. On many of those days, you were certain you wouldn't. And then you did. Not because you were prepared or because it wasn't that bad — but because you are genuinely resilient in ways that sometimes surprise you.",
  "Hard experiences leave deposits of strength. Things you didn't even notice going in accumulate into a kind of quiet toughness. You are more robust than you feel in this moment. The moments of toughness are real, even if this moment is soft and scared.",
  "Give yourself credit for showing up to your life, especially on the hard days. Especially when it would be easier to disappear or shut down or give in to despair. That you are here, breathing, trying — that's not nothing. That's everything.",
  "The most durable kind of hope is not the kind that says 'everything will be perfect.' It's the kind that says 'I have resources I don't always see, and I'll find them when I need them.' You've found them before. They don't disappear. They are part of who you are.",
  "Something in you refuses to give up. Even in the hardest moments, something keeps trying — keeps breathing, keeps looking for a way through. That quality is yours. You didn't manufacture it; it's been there since the beginning. It's there now.",
  "You are not the first person to feel this way, and every person who has felt this way and come out the other side did so the same way you will: one moment at a time, not knowing how, just continuing. That's the whole secret. Just continue.",
  "Your worst days have not been your last days. They have been hard chapters in a story that continues. You are still in the story. The chapter is hard right now, but the story isn't over, and stories like yours tend to have moments of relief and even beauty ahead.",
  "What feels like falling apart might actually be falling open. Sometimes the structures we held onto weren't serving us, and the discomfort of them loosening is grief. But what's underneath — the actual you — is not falling apart. It's still whole.",
  "You have permission to be exactly as okay or as not-okay as you actually are. You don't have to perform stability. But know this: even in the not-okay, you are still fully yourself, still capable, still loved. Being not-okay does not make you less.",
  "Every time you choose to breathe through something instead of running from it, you build a little more trust with yourself. Trust that you can handle what comes. That trust is real wealth. You're building it right now, even as things feel hard.",
  "You are the protagonist of your own life and protagonists go through hard things. They always do. The hard things are how the character is revealed. You're being revealed right now — as someone who keeps going, who keeps breathing, who keeps showing up. That's a good character.",
  "This is not your ending. Even if it feels enormous, even if it feels final — it's not. It's a chapter. Maybe an important one. But chapters end and new ones begin. You have many pages ahead of you that you can't see yet, and some of them are really, truly good.",

  // ── SLEEP & REST ──
  "Sleep and the anxious mind have a complicated relationship. But right now, your only job is to rest the body. Even if the mind won't fully quiet, the body can soften. Let your muscles release. Let your jaw unclench. Let your hands open. Rest is available to the body even when the mind is busy.",
  "You don't have to solve it tonight. Whatever it is. It will still be there tomorrow — exactly as much as it is now — and you will be better equipped to face it after rest. Nighttime is not for problem-solving. It's for returning to the body and letting the mind drift.",
  "The things that feel most urgent at 2am are almost never as urgent by morning. There is something about nighttime that amplifies everything — every fear is louder, every problem is larger, every uncertainty feels permanent. But then morning comes and the light changes things. Trust morning.",
  "Lying down in the dark, breathing — that is rest, even when it doesn't feel like sleep. The body benefits from horizontal and still. You don't have to fall asleep to rest. You just have to stop insisting on being awake and braced. Let yourself go horizontal. Let yourself be still.",
  "The night is not evidence of how dark things will be. It's just the night. A temporary darkening that has never, in the history of the world, failed to give way to morning. Your night will also give way. Not because life is simple, but because it always has before.",
  "You can stop trying to sleep. The trying is often what makes it hard. Instead just lie here. Feel the weight of yourself against whatever you're lying on. Notice the darkness behind your eyelids. Breathe without making it a task. Let rest happen to you rather than forcing it.",
  "Your mind's activity at night is not important data. It's just your brain doing its nighttime processing — sorting, worrying, spiraling a little. You don't have to take the content seriously. Let it play in the background. You don't have to respond to every thought.",
  "Tomorrow's problems don't need solving tonight. They are tomorrow's problems and they will come with tomorrow's energy, tomorrow's perspective, tomorrow's resources. Tonight's only job is tonight. And tonight's job is quite small: just rest. Just breathe. Just be horizontal.",
  "Nighttime anxiety has a texture all its own. The quiet amplifies things. The dark removes distractions. But it also means morning will be a genuine shift — lighter, more resource-rich, populated with options. Sleep, or rest, or even just lying quietly, is moving you toward that morning.",
  "You are safe in your bed. The things that feel threatening are in your mind, not in the room. The room is the same room it was earlier today. The darkness hasn't changed anything. Your physical body is safe, resting, held by gravity and the surface beneath you.",

  // ── BODY AWARENESS ──
  "Your body is not your enemy right now. Even though it feels alarmed, even though your heart is beating faster or your breathing is shallow — your body is trying to help you. These responses evolved to protect. You can thank your body and then gently invite it to stand down.",
  "Breathing slowly is not just a feeling trick. It actually sends a signal to your nervous system via the vagus nerve: things are okay, you can relax. The signal goes from breath to brain, not just brain to breath. So your breath is actually doing something real. Keep going.",
  "Notice what's happening in your body without judgment. Is there tightness somewhere? Heaviness? A kind of buzzing or electricity? Just name it. Don't try to fix it. Naming it gives you a little distance from it — it becomes 'tightness in my chest' rather than 'I'm dying.'",
  "Your hands. Look at them, or feel them, right now. Press your fingertips together. The sensation of that contact is real. It's present. It's here. When you're overwhelmed, the hands are an anchor. They're always available. They're always doing something you can feel.",
  "Unclench your jaw. Roll your shoulders back and down. Let your hands open. These small physical acts are not nothing — they send the nervous system new information. Not alarm, not bracing, but ease. Every time you choose ease in the body, you're choosing it for the mind too.",
  "The breath is always available. No matter where you are, no matter what's happening, you can take one slow, deliberate breath. You can make the exhale longer than the inhale. This single act has measurable effects on your nervous system. It's a superpower available at all times.",
  "Anxiety lives in the body as much as in the mind. You can do something about the body: go slow. Move gently. Relax one muscle at a time. The body responding to calm signals from you creates a feedback loop. Tell your body it's okay, and it will start to believe you.",
  "Your heartbeat is not dangerous, even when it's fast. A fast heart rate during anxiety is your body doing exactly what it's supposed to do — preparing you for challenge. There is no danger to the heart from anxiety. The sensation can be alarming without actually being alarming.",
  "Try breathing into your belly instead of your chest. Chest breathing feeds the sympathetic nervous system. Belly breathing — diaphragmatic breathing — feeds the parasympathetic. It literally changes your biochemistry. Breathe low and slow. Do it again. Feel the difference.",
  "The tension in your body has been there a while. Anxiety often builds for hours before we notice it. You've been carrying this in your muscles. Now notice where the tension is and breathe directly toward it. Not to fix it, just to acknowledge it. To say: I see you, and I'm here.",

  // ── CONNECTION & NOT ALONE ──
  "You are not the only one who has ever felt this way. Right now, as you read this, there are thousands of people feeling something similar — lying awake, breathing through fear, trying to find the ground. You are not uniquely broken. You are universally human.",
  "Anxiety is one of the most common human experiences. You are not strange for having it. You are not weak. You are part of the vast majority of humans who have felt exactly this. There is nothing wrong with you for feeling what almost everyone at some point has felt.",
  "Somewhere, right now, someone else is doing exactly what you're doing — breathing through something hard, feeling scared, hoping for relief. You are part of that community. You are not alone in this, even when it feels that way.",
  "People who love you have felt fear too. They've been where you are and found their way to the other side. Their experience doesn't solve yours, but it means something: that the people in your life know this road. You are not on a road no one has traveled.",
  "The fact that you are reaching for something to help you through this — reading this, breathing with this, being here — that instinct toward self-care is healthy and right. You are trying to take care of yourself. That's love. That's the right response to difficulty.",
  "Many of the people who seem most together have wrestled with exactly what you're wrestling with. Not everyone shows it. Not everyone talks about it. But it's there. You would be surprised by how many people would nod if you told them exactly what you're feeling.",
  "There are people in the world who care about you. Who would want to know you're struggling. Who would want to sit with you. That care is real, even when you can't feel it from where you are right now. It's real. It's there. You are held in people's hearts even now.",
  "Help exists. Calm exists. Relief exists. You know this from your own history — there have been times when things felt better, when you felt supported, when the weight lifted. Those things haven't stopped existing. They will be available to you again.",
  "The kindness of strangers who made something to help you — wrote something, built something, shared something — is real. Right now you are in the care of that intention. Someone wanted you to feel better. That's a small but real thread connecting you to the broader human desire to help.",
  "You are part of something larger than this moment. Larger than this fear. Larger than this night or this worry or this particular difficulty. You are a human among billions of humans, most of whom are trying their best, most of whom have known fear, most of whom have found their way through.",

  // ── MINDFULNESS & OBSERVATION ──
  "You don't have to do anything with a thought. Thoughts come. They make noise. They feel important. And then they pass. You don't have to believe them, argue with them, or act on them. You can just watch them arrive and move on. They're visitors, not residents.",
  "The anxious mind generates content on a loop. The same fears, dressed slightly differently, cycling through. You don't have to engage with the loop. You can step back from it. Notice: ah, there's the loop again. It doesn't need my participation. Let it run. You don't have to watch.",
  "Mindfulness is not about having a quiet mind. It's about knowing where you are in relation to your mind. You can be aware of the thoughts without being swept away by them. The thoughts are there. You are also here, aware of them. That gap is everything.",
  "You are the sky. Your thoughts are clouds. Some clouds are dark and frightening. Some are light and fast. All of them pass. The sky doesn't become the clouds and you don't become your thoughts. Let them pass. You remain. Open, spacious, unchanging underneath.",
  "Notice right now: there is the thought, and there is the one who notices the thought. They are not the same. The thought says 'everything is going wrong.' The noticer observes 'the thought says everything is going wrong.' The noticer is not frightened. The noticer is just noticing.",
  "Anxiety produces thoughts that feel like facts. 'This is going to be terrible.' 'I can't handle this.' These feel like statements about reality, but they are actually predictions made by a frightened brain. Facts are verifiable. Predictions are guesses. You don't have to take the guess as truth.",
  "Come to your senses: what do you hear right now? Let the sounds just be sounds — not meaningful, not threatening, just sound waves arriving at your ears. The hum of something. The distance of traffic. Your own breath. Sound is just sound. You can rest in that simplicity.",
  "Your thoughts are not you. You are the one who has thoughts. There's a difference. Your thoughts are generated by a brain doing its best in a challenging situation. You are something larger than that — the aware, ongoing being that observes the brain's activity. You are not the anxiety.",
  "A thought is just a thought. It becomes suffering when we treat it as a command or a prophecy. But you can let a thought be just a thought: a firing of neurons, a formation of words, a pattern passing through. It doesn't have to become more than that.",
  "What's actually happening right now — not what the story says is happening, but what is actually, physically, sensory happening — is probably much more manageable than what your mind is constructing. Come back to what is literally true in this moment. It's much smaller. Much more okay.",

  // ── TRUST & FAITH IN YOURSELF ──
  "You have navigated complexity before. You have made decisions under uncertainty before. You have found your way through confusion before. The evidence that you can do hard things is extensive. Your anxiety may be hiding it from you right now, but the evidence exists.",
  "There is a part of you — deep, quiet, steady — that has never been fully undone by anything. Every storm has passed over it. Every fear has moved through it. Every difficulty has eventually resolved around it. That part is still there. You can rest in it. You are it.",
  "You have better instincts than fear gives you credit for. Your judgment, your sense of what's right, your capacity to figure things out — these are real and reliable. Fear temporarily obscures them, but it doesn't erase them. When you're steadier, they'll be clear again.",
  "You will find your way through this, even if you can't see how right now. Not because you have a plan — maybe you don't. But because you always have. Because humans do. Because the capacity to find a path is something you carry with you, even when you can't feel it.",
  "There is knowing inside you that you can't access when you're flooded. It's still there — the clear-eyed, wise part that sees things as they are, that knows what to do, that has good judgment. When the flood recedes, you'll be able to hear it again. It hasn't left. Just wait.",
  "You have handled uncertainty before. You have gone into situations not knowing how they would go and come out the other side. Your track record of navigating the unknown is complete. Every unknown you've ever faced has eventually become known, and you've handled the knowing.",
  "Trust that you will figure out what you need to figure out when you need to figure it out. You don't have to have the answers tonight. The answers will come when the time is right. Your mind is good at solving things — it just can't do it well when it's panicking.",
  "Your inner resources are real, even when they're not visible to you. Like a phone running low, you need rest and recharging, not replacement. The capacity is all there. It needs restoration. Right now, rest is how you restore. Let yourself rest.",
  "You have good judgment. It may not feel like it when you're anxious, but your judgment has served you many times. When you're calmer, you'll see more clearly. Trust that you can trust yourself. The anxious state distorts things — your judgment when rested is far more reliable.",
  "You are going to make it through this. Not because I know what 'this' is, but because you've made it through everything else. The formula isn't secret: breathe, rest, keep going, ask for help when you need it. You know this formula. You've used it before. Use it now.",

  // ── GRATITUDE & SMALL THINGS ──
  "In the middle of difficulty, it can help to name something small that is okay. Not to minimize the struggle — just to find the ground. One thing that's real and okay. A temperature that isn't unpleasant. A texture that's soft. Something small. It doesn't have to fix anything.",
  "There are things working in your favor right now that you might not be counting. Your heart is beating. Your lungs are working. Something in you is actively seeking relief and comfort. These are not nothing. Life is still happening in you and for you, even now.",
  "Gratitude is not toxic positivity. It's the practice of noticing what is real alongside what is hard. Both are true. Something hurts. Something else is okay. You can hold both. The hard one doesn't erase the okay one. Let them be true at the same time.",
  "Small comforts matter. The feel of a blanket. The smell of something warm. A familiar sound. These small sensory pleasures are real and they are available to you and they help. Use them without guilt. You don't have to earn comfort. You just have to receive it.",

// Seeded shuffle for good randomization
function seededRNG(seed) {
  let s = seed;
  return () => {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

function shuffleWithSeed(arr, seed) {
  const rng = seededRNG(seed);
  const a = [...arr.map((m, i) => ({ m, i }))];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Shuffle once per day (seed = date)
const todaySeed = parseInt(new Date().toISOString().slice(0, 10).replace(/-/g, ''));
let order = shuffleWithSeed(MESSAGES, todaySeed);
let currentIndex = 0;

const msgEl = document.getElementById('message');
const numEl = document.getElementById('msg-num');

function showMessage(idx) {
  const entry = order[idx % order.length];
  msgEl.classList.remove('visible');
  setTimeout(() => {
    msgEl.textContent = entry.m;
    numEl.textContent = `${entry.i + 1} / ${MESSAGES.length}`;
    msgEl.classList.add('visible');
  }, 700);
}

document.getElementById('next-btn').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % order.length;
  showMessage(currentIndex);
});

// Show first message on load
setTimeout(() => showMessage(0), 1500);
</script>
